name: Build

# push / PR / 手動実行 で Web版バンドルと Android APK をビルドし、Artifacts に保存する
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Validate map definitions
        run: npm run validate

      - name: Build web bundle (Vite)
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: pikagen-web
          path: dist/
          retention-days: 30

      - name: Generate Android project (Capacitor)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npm run android:prepare
          npx cap sync android

      - name: Build debug APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/pikagen-${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pikagen-apk
          path: out/*.apk
          retention-days: 30
