name: Build

# push / PR / 手動実行 で Web版バンドルと Android APK をビルドし、Artifacts に保存する
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest には Android SDK がプリインストール済み（ANDROID_HOME）。ライセンスだけ承諾する
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm ci

      - name: Validate map definitions
        run: npm run validate

      - name: Build web bundle (Vite)
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v5
        with:
          name: pikagen-web
          path: dist/
          retention-days: 30

      # 常時音声認識用の日本語モデル（オフライン認識 Vosk）。毎回ダウンロードしないようキャッシュする
      - name: Cache Japanese speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: .cache/vosk-model-ja
          key: vosk-model-small-ja-0.22

      - name: Download Japanese speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache
          curl -fsSL --retry 4 -o .cache/model.zip https://alphacephei.com/vosk/models/vosk-model-small-ja-0.22.zip
          unzip -q .cache/model.zip -d .cache
          mv .cache/vosk-model-small-ja-0.22 .cache/vosk-model-ja
          rm .cache/model.zip
          ls .cache/vosk-model-ja

      - name: Generate Android project (Capacitor)
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npm run android:prepare
          npx cap sync android

      - name: Build debug APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/pikagen-${GITHUB_RUN_NUMBER}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: pikagen-apk
          path: out/*.apk
          retention-days: 30
